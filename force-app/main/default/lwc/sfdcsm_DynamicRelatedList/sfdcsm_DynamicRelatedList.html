<template>
    <template lwc:if={shouldRenderComponent}>
        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </template>
        <template lwc:else>
            <div class="slds-m-vertical_large">
                <header class={titleClass}>
                    <b>{title}</b>
                </header>
                <template lwc:if={hasData}>
                    <lightning-datatable
                        key-field="id"
                        data={rows}
                        columns={columns}
                        hide-checkbox-column
                        wrap-text-max-lines="3">
                    </lightning-datatable>
                </template>
                <template lwc:elseif={error}>
                    <div class="slds-box slds-theme_default">
                        <p class="slds-text-body_regular slds-text-color_error">{errorMessage}</p>
                    </div>
                </template>
                <template lwc:else>
                    <div class="slds-box slds-theme_default">
                        <p class="slds-text-body_regular slds-text-color_weak">No records available.</p>
                    </div>
                </template>
            </div>
        </template>
    </template>
</template>
