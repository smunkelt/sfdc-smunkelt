<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded background -->
  <rect width="100" height="100" rx="14" fill="#0176d3"/>

  <!-- Banner body -->
  <rect x="10" y="32" width="80" height="36" rx="7" fill="white" opacity="0.97"/>

  <!-- Left icon square -->
  <rect x="18" y="40" width="20" height="20" rx="5" fill="#0176d3"/>
  <!-- Icon: simple envelope shape inside the square -->
  <polyline points="18,40 28,50 38,40" fill="none" stroke="white" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="18" y="40" width="20" height="20" rx="5" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- Text lines -->
  <rect x="45" y="43" width="26" height="4" rx="2" fill="#0176d3" opacity="0.75"/>
  <rect x="45" y="51" width="18" height="3" rx="1.5" fill="#0176d3" opacity="0.4"/>

  <!-- Action button on the right -->
  <rect x="74" y="41" width="10" height="18" rx="4" fill="#0176d3" opacity="0.9"/>
  <!-- Button tick / arrow -->
  <polyline points="77,50 79,53 83,47" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
